{{ $page := . }}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ "" | relURL }}">Docs</a></li>
    {{ range .Ancestors.Reverse }}
      {{ if not .IsHome }}
      <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{ end }}
    {{ end }}
    <li><span aria-current="page">{{ $page.LinkTitle }}</span></li>
  </ol>
</nav>
