baseURL = 'https://staticcanvas.gitlab.io/hawk/'
locale = 'en-AU'
title = 'Hawk documentation'
publishDir = '../public'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term']

[params]
  version = '0.11.0'
  description = 'Themeable, pluggable command-palette search for static sites. Pagefind-powered indexing, swappable reveal animations, swappable visual themes.'
  repository = 'https://gitlab.com/staticcanvas/hawk'
  github = 'https://github.com/staticcanvas/hawk'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = false
    tabWidth = 2

[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = '../branding'
  target = 'static/assets/branding'
[[module.mounts]]
  source = '../theme-templates'
  target = 'static/assets/theme-templates'

